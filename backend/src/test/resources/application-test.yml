spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:attendance-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-local.sql
      data-locations: classpath:data-local.sql

face:
  recognition:
    url: http://127.0.0.1:59999

jwt:
  secret: test-secret-key-that-is-long-enough-for-hs256-signing-only
  expiration: 86400000
  refresh-expiration: 604800000
