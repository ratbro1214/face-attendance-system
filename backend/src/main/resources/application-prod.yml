server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://your-production-host:3306/attendance_system?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# 人脸识别服务配置
face:
  recognition:
    url: ${FACE_RECOGNITION_URL}
    timeout: 10000

# 文件上传配置
file:
  upload:
    path: /var/www/attendance-uploads/
    face-image-path: /var/www/attendance-uploads/face-images/
  url-prefix: https://your-domain.com/uploads/

# 日志配置
logging:
  level:
    com.attendance: info
