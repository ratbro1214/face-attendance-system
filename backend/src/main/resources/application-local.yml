server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/attendance;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;AUTO_SERVER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-local.sql
      data-locations: classpath:data-local.sql

face:
  recognition:
    url: http://localhost:5000
    timeout: 10000

file:
  upload:
    path: ./uploads/
    face-image-path: ./uploads/face-images/
  url-prefix: http://localhost:8080/api/uploads/
