server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: attendance-system
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT配置
jwt:
  secret: your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-change-this-in-production
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    com.attendance: debug

attendance:
  check-in-before-minutes: 15
  check-in-after-minutes: 30
  late-grace-minutes: 10
  face-proof-valid-seconds: 120
